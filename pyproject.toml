[project]
name = "agentes-gb"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fpdf2>=2.8.9",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.17",
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary]>=3.3.6",
    "pypdf>=6.21.2",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
